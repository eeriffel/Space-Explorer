<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Space Explorer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <video autoplay loop muted playsinline class="space-background">
        <source src="{{ url_for('static', filename='videos/stars.mp4') }}"
                type="video/mp4">
    </video>

    <main class="home-page">

        <section class="hero-card">


            <h1>Space Explorer</h1>


            <p class="hero-description">
                Explore exoplanets, near Earth asteroids, and objects
                throughout our solar system using real data.
            </p>

            <a class="primary-button"
               href="{{ url_for('explore') }}">
                Begin Exploring
            </a>

        </section>

    </main>

</body>

</html>
